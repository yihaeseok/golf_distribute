<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리끼리 골프챌린지</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="골프챌린지" id="iosTitle">
<meta name="theme-color" content="#14532d">
<style>
:root{--bg:#f6f4ee;--card:#fff;--sand:#ece5d6;--turf:#14532d;--turf-mid:#2a7a51;
 --ink:#16211b;--muted:#657a6f;--line:#ddd7c8;--clay:#a8491c;--shade:rgba(20,40,30,.22);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#101712;--card:#19221c;--sand:#232e26;--turf:#8fd3ab;--turf-mid:#6bbd8e;
 --ink:#e8efe9;--muted:#95a89d;--line:#2d3a32;--clay:#e59a6b;--shade:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#101712;--card:#19221c;--sand:#232e26;--turf:#8fd3ab;
 --turf-mid:#6bbd8e;--ink:#e8efe9;--muted:#95a89d;--line:#2d3a32;--clay:#e59a6b;--shade:rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
 font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);
 border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:0;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.bar .sub{font-size:12px;color:var(--muted);font-weight:400}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.foot{padding:10px 14px 14px;background:var(--card);border-top:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
p.note{color:var(--muted);font-size:13px;margin:6px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],textarea,select{
 width:100%;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);
 border:1px solid var(--line);border-radius:9px}
/* 모바일 기본 날짜·시간 선택기가 카드 너비를 밀어내지 않도록 제한합니다. */
input[type=date],input[type=time]{display:block;width:100%;max-width:100%;min-width:0;font-size:16px}
textarea{min-height:110px;font-size:13px;line-height:1.45;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{
 outline:3px solid var(--turf-mid);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:block;width:100%;padding:15px;border-radius:11px;background:var(--turf);
 color:var(--card);font-weight:650;font-size:17px;text-align:center}
.btn.quiet{background:var(--sand);color:var(--ink);font-weight:550}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:550}
.btn.sm{padding:11px;font-size:15px;border-radius:9px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chip{padding:7px 11px;border-radius:999px;background:var(--sand);font-size:13px;font-weight:550;white-space:nowrap}
.chip.on{background:var(--turf);color:var(--card)}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.banner{background:var(--turf);color:var(--card);padding:13px 14px;display:flex;align-items:center;gap:10px}
.banner span{flex:1;font-size:14px;font-weight:550}
.banner button{background:var(--card);color:var(--turf);padding:8px 13px;border-radius:999px;font-size:13px;font-weight:650}
.holehead{display:flex;align-items:baseline;gap:12px;padding:14px 14px 8px}
.holenum{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em}
.holepar{font-size:15px;color:var(--muted);font-weight:600}
.strip{display:flex;gap:3px;padding:0 14px 10px}
.seg{flex:1;height:7px;border-radius:2px;background:var(--sand);border:none;padding:0}
.seg.part{background:var(--clay)}.seg.done{background:var(--turf-mid)}
.seg.cur{box-shadow:0 0 0 2px var(--turf)}
.plr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:7px}
.plr .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.plr .nm{font-weight:650;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plr .hc{font-size:12px;color:var(--muted)}
.plr .st{font-size:12px;color:var(--clay);font-weight:600}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(28px,1fr));gap:4px}
.keys .key{min-height:28px;height:auto;padding:4px 5px;font-size:14px;border-radius:7px;
 white-space:nowrap;overflow:visible}
.key{height:46px;border-radius:9px;background:var(--sand);font-size:17px;font-weight:650;
 display:flex;align-items:center;justify-content:center}
.key.on{background:var(--turf);color:var(--card)}
.key.more{font-size:15px;color:var(--muted)}
.pm{display:flex;align-items:center;gap:8px}
.pm .mbtn{width:56px;height:48px;border-radius:9px;background:var(--sand);font-size:24px;font-weight:650;
 display:flex;align-items:center;justify-content:center}
.pm .val{flex:1;height:48px;border-radius:9px;background:var(--turf);color:var(--card);
 display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700}
.pm .val.pending{background:var(--sand);color:var(--muted)}
.sheet{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;z-index:30}
.sheet .inner{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:16px;
 padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.grid5 .key{height:46px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.grid3 .key{height:44px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));
 background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:88%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12px}
td.win{font-weight:700;color:var(--turf)}
.hx th,.hx td{padding:7px 9px;font-size:13px}
.hx td.u{color:var(--clay)}
.hx th.hid{color:var(--clay);font-weight:700}
.ed input{width:50px;padding:7px 2px;text-align:center;font-size:14px}
.gm{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:none}
.gm .nm{flex:1;font-weight:600}
.gm input[type=number]{width:88px}
.teambox{display:flex;gap:10px}
.teambox>div{flex:1;background:var(--sand);border-radius:10px;padding:10px}
.hero{display:flex;align-items:center;gap:10px;padding:14px 12px;
 background:var(--turf);color:var(--card)}
.hero .crest{width:42px;height:42px;border-radius:50%;background:var(--card);color:var(--turf);
 display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.hero .hname{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25;
 display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero .hrole{font-size:10px;font-weight:650;padding:2px 6px;border-radius:999px;white-space:nowrap;line-height:1.35;
 background:var(--card);color:var(--turf);flex:none}
.hero .hsub{display:flex;align-items:center;gap:4px;min-width:0;font-size:clamp(10px,2.9vw,12px);opacity:.85;margin-top:3px;white-space:nowrap;letter-spacing:-.02em}
.hero .hcounts{min-width:0;overflow:hidden;text-overflow:ellipsis}
.hero .hversion{flex:none}
.hero .hmain{flex:1;min-width:0}
.hero .hline{font-size:clamp(10px,2.9vw,12px);opacity:.88;margin-top:3px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.sig{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;
 background:rgba(255,255,255,.14);border-radius:12px;padding:9px 11px;min-width:76px}
.sig .lamp{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.26);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.sig .lamp.on{background:#5fe08a;box-shadow:0 0 0 3px rgba(95,224,138,.3)}
.sig .lamp.red{background:#ff7a5c;box-shadow:0 0 0 3px rgba(255,122,92,.3)}
.sig .lamps{display:flex;gap:7px}
.sig .txt{font-size:11px;font-weight:650;line-height:1.2;text-align:center}
.ribbon{background:var(--clay);color:#fff;padding:3px 9px;border-radius:999px;
 font-size:11.5px;font-weight:700;flex:none}
.ribbon.done{background:var(--turf-mid)}
.pop{font-size:16px}
tr.gold td{background:var(--turf-soft,rgba(42,122,81,.12));font-weight:700}
tr.gold td:first-child{color:var(--turf)}
.star{font-size:17px}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
 padding:0 3px;font-weight:650;line-height:1}
.mk.bogey{border:1.5px solid var(--ink);border-radius:3px}
.mk.dbl{border:1.5px solid var(--ink);border-radius:3px;box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--ink)}
.mk.birdie{border:1.5px solid var(--turf);border-radius:50%;color:var(--turf)}
.mk.eagle{border:1.5px solid var(--turf);border-radius:50%;color:var(--turf);
 box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--turf)}
.mk.onion{background:var(--clay);color:#fff;border-radius:4px}
.parpick{display:flex;gap:6px;align-items:center;padding:0 14px 10px}
.parpick .lb{font-size:13px;color:var(--muted);flex:none}
.parpick button{flex:1;height:40px;border-radius:9px;background:var(--sand);font-weight:650;font-size:15px}
.parpick button.on{background:var(--turf);color:var(--card)}
@media (prefers-reduced-motion:no-preference){
 .toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(6px)}}}

/* 라운딩 수정에서 선택하지 않은 회원의 점수 행은 표시하지 않습니다. */
[data-edit-score-row][hidden],[data-edit-gross-row][hidden]{display:none!important}
/* 홈 메뉴 네 칸을 작은 휴대전화에서도 한 줄로 고정합니다. */
.home-nav{gap:5px;padding:9px 10px}
.home-nav .chip{flex:1;min-width:0;text-align:center;padding:8px 2px;
 font-size:clamp(10px,2.8vw,13px);font-weight:600;letter-spacing:-.035em}
.reverse-label{color:var(--ink);font-weight:650}
/* 첫 화면의 라운드 요약은 종목 수가 많아도 최대 두 줄만 표시합니다. */
.round-summary{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
 line-clamp:2;max-height:3.1em;line-height:1.55;overflow:hidden;overflow-wrap:anywhere}
/* 첫 화면에서 날짜·시각·장소를 한 줄에 몰아넣어 시각이 잘리는 문제를 방지합니다. */
.round-meta{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;min-width:0;
 color:var(--muted);font-size:12px;line-height:1.5;margin-top:2px}
.round-meta .round-tee{flex:none;font-weight:650;white-space:nowrap;color:var(--ink)}
.round-meta .round-place{flex:1 1 100px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 라운드 상세 머리행에서도 시간은 아래 줄에 표시하여 가려지지 않게 합니다. */
.bar h1.round-head{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
.bar h1.round-head .sub{margin-top:2px;white-space:normal;overflow-wrap:anywhere;line-height:1.4}
.round-head .round-tee{white-space:nowrap;font-weight:600}
.rules-intro{font-size:14px;line-height:1.6;margin:0}
.rule-desc{font-size:14px;line-height:1.65;margin:0}
.rule-desc+.rule-desc{margin-top:7px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var APP_NAME="우리끼리 골프챌린지", APP_VER="1.3.1";
/* 공급본 공통 HTML: 아래 URL은 서버 웹앱 배포 후 한 번만 설정합니다. */
var SUPPLY_PARAMS=new URLSearchParams(window.location.search);
var SUPPLY_SLUG_RE=/^[a-z][a-z0-9-]{2,59}$/;
/* v1.2.0: 모임 식별번호가 없을 때 특정 모임으로 자동 연결하지 않습니다.
   다만 이 기기에 이미 저장된 모임이 하나뿐이면 기존 즐겨찾기 호환을 위해 그 모임으로 들어갑니다. */
function supplyStoredClubs(){
 var out=[];
 try{
  for(var i=0;i<localStorage.length;i++){
   var k=localStorage.key(i),m=k&&k.match(/^woorigolf\.supply\.([a-z][a-z0-9-]{2,59})\.data$/);
   if(!m)continue;
   var name=m[1];
   try{var d=JSON.parse(localStorage.getItem(k));
    if(d&&d.room&&d.room.clubId===m[1]&&typeof d.room.name==="string"&&d.room.name)name=d.room.name}catch(e){}
   out.push({id:m[1],name:name});
  }
 }catch(e){}
 out.sort(function(a,b){return a.id<b.id?-1:1});
 return out;
}
var SUPPLY_STORED=supplyStoredClubs();
var SUPPLY_CLUB_ID=SUPPLY_SLUG_RE.test(SUPPLY_PARAMS.get("club")||"")?SUPPLY_PARAMS.get("club")
 :(SUPPLY_STORED.length===1?SUPPLY_STORED[0].id:"");
var SUPPLY_CLUB_PICK=!SUPPLY_CLUB_ID;
var SUPPLY_CLUB_NAME=SUPPLY_CLUB_ID?((SUPPLY_PARAMS.get("name")||"").slice(0,60)||
 (function(){for(var i=0;i<SUPPLY_STORED.length;i++)if(SUPPLY_STORED[i].id===SUPPLY_CLUB_ID)return SUPPLY_STORED[i].name;return SUPPLY_CLUB_ID})())
 :APP_NAME;
function supplyGoClub(id){
 if(!SUPPLY_SLUG_RE.test(id))return;
 location.href=location.pathname+"?club="+encodeURIComponent(id);
}
function supplyAskClub(){
 var v=(prompt("접속하실 모임 식별번호를 넣어 주십시오. 초대주소를 받으셨다면 그 주소로 들어오시는 편이 확실합니다.","")||"").trim();
 if(!v)return;
 if(!SUPPLY_SLUG_RE.test(v)){alert("모임 식별번호 형식이 올바르지 않습니다.");return}
 supplyGoClub(v);
}
var DEFAULT_CLOUD=""; // 경기위원장이 최초 1회 설정, 회원은 초대 링크로 자동 설정
/* 기존 경오마스터즈의 localStorage와 다른 이름을 사용합니다. */
var DKEY="woorigolf.supply."+(SUPPLY_CLUB_ID||"__none__")+".data";
var LKEY="woorigolf.supply."+(SUPPLY_CLUB_ID||"__none__")+".local";
var S=null,L=null,view={name:"home"},sheet=null,tTimer=null,scan=null,busy=false;
// 경기위원장 인증 토큰은 장기 저장하지 않고 브라우저 탭 세션에만 저장합니다.
var HOST_SESSION_STORAGE_KEY="woorigolf.supply."+(SUPPLY_CLUB_ID||"__none__")+".hostSession";
var hostSession="";
function forgetHostSession(){hostSession="";try{sessionStorage.removeItem(HOST_SESSION_STORAGE_KEY)}catch(e){}}
function rememberHostSession(token){hostSession=token;try{sessionStorage.setItem(HOST_SESSION_STORAGE_KEY,token)}catch(e){}}
function hostSessionActive(){return L&&L.mode==="host"&&!!hostSession}
function rejectHostSession(message){forgetHostSession();L.mode="member";save(false);render();toast(message||"경기위원장 인증이 만료되었습니다. 다시 인증하십시오.")}
function isHostExpiredResult(res){return !!(res&&/경기위원장 인증이 (만료|변경)/.test(res.error||""))}

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function blankS(){return{schemaVersion:4,room:{id:"pending",clubId:SUPPLY_CLUB_ID,name:SUPPLY_CLUB_NAME,createdAt:null},members:[],rounds:[],hcpWindow:5,updatedAt:null}}
function validClubData(d){return !!(d&&d.schemaVersion===4&&d.room&&d.room.clubId===SUPPLY_CLUB_ID&&typeof d.room.name==="string"&&d.room.name.length>0&&Array.isArray(d.members)&&Array.isArray(d.rounds))}
function blankL(){return{mode:"member",cloudNew:false,serverVer:"",inputMode:"numbers",myGroup:{},cloudUrl:"",cloudReadKey:"",dirty:false,
 lastSaved:null,lastSync:null,lastName:"",seeded:false}}
function load(){
 try{var a=localStorage.getItem(DKEY);S=a?JSON.parse(a):blankS()}catch(e){S=blankS()}
 try{var b=localStorage.getItem(LKEY);L=b?JSON.parse(b):blankL()}catch(e){L=blankL()}
 if(!validClubData(S)) S=blankS();
 else SUPPLY_CLUB_NAME=S.room.name;
 // 초대 링크의 비밀 키는 서버 쪽 요청 URL이 아니라 브라우저 URL 조각에서 읽습니다.
 // 최초 저장 후 주소 표시줄에서 제거하되, 복사·공유시 직접 다시 붙여야 합니다.
 try{
  var frag=new URLSearchParams(window.location.hash.slice(1));
  var memberKey=frag.get("memberKey");
  if(memberKey&&/^wgk_[a-f0-9]{128}$/.test(memberKey)){
   if(!L||typeof L!=="object")L=blankL();
   var srv=frag.get("server")||"";
   if(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(srv))L.cloudUrl=srv;
   L.cloudReadKey=memberKey;
   try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}
   history.replaceState(null,"",window.location.pathname+window.location.search);
  }
 }catch(e){}
 if(!S.members)S.members=[];if(!S.rounds)S.rounds=[];
 if(!S.hcpWindow)S.hcpWindow=5;
 if(!L||typeof L!=="object")L=blankL();
 if(!L.myGroup)L.myGroup={};if(!L.mode)L.mode="member";if(!L.inputMode)L.inputMode="numbers";
 if(!L.cloudReadKey)L.cloudReadKey="";if(typeof L.dirty!=="boolean")L.dirty=false;
 // v1.1.0에서 브라우저에 보관했던 쓰기 키는 삭제합니다.
 if(Object.prototype.hasOwnProperty.call(L,"cloudPw"))delete L.cloudPw;
 try{hostSession=sessionStorage.getItem(HOST_SESSION_STORAGE_KEY)||""}catch(e){hostSession=""}

function autoTeamValue(r,mid,basis){
 if(basis!=="improve")return r&&r.date?hcpAt(mid,r.date,r.id||null):curHcp(mid);
 var pr=priorOf(mid,(r&&r.date)||"9999-12-31",(r&&r.id)||null);
 if(pr.length<2)return 0;

}

function autoTeams(r,n,basis){
 n=n||teamCountOf(r);if(n<2)n=2;if(n>4)n=4;
 var ps=r.players.slice();
 if(ps.length<n){r.teams={};ps.forEach(function(mid,i){r.teams[mid]=TEAM_KEYS[i%n]});return r.teams}
 var H={};ps.forEach(function(mid){H[mid]=autoTeamValue(r,mid,basis||"net")});
 var big=Math.ceil(ps.length/n),small=Math.floor(ps.length/n);
 var rest=ps.length%n;
 var cap=[];for(var i=0;i<n;i++)cap.push(i<rest?big:small);
 /* 핸디가 큰 사람부터, 자리가 남은 팀 중 합이 가장 작은 곳에 넣는다 */
 var order=ps.slice().sort(function(x,y){return H[y]-H[x]});
 var bucket=[];for(var j=0;j<n;j++)bucket.push([]);
 order.forEach(function(mid){
  var best=-1,bv=Infinity;
  for(var k=0;k<n;k++){
   if(bucket[k].length>=cap[k])continue;
   var sum=0;bucket[k].forEach(function(x){sum+=H[x]});
   if(sum<bv-0.00001||(Math.abs(sum-bv)<0.00001&&(best<0||bucket[k].length<bucket[best].length))){bv=sum;best=k}}
  if(best<0)best=0;
  bucket[best].push(mid)});
 function sums(){return bucket.map(function(b){var t=0;b.forEach(function(x){t+=H[x]});return t})}
 function spread(){var v=sums();return Math.max.apply(null,v)-Math.min.apply(null,v)}
 /* 두 사람씩 맞바꿔 보며 더 고르게 만든다 */
 for(var pass=0;pass<60;pass++){
  var cur=spread(),done=true;
  for(var a1=0;a1<n&&done;a1++)for(var b1=a1+1;b1<n&&done;b1++)
   for(var x1=0;x1<bucket[a1].length&&done;x1++)for(var y1=0;y1<bucket[b1].length&&done;y1++){
    var t1=bucket[a1][x1],t2=bucket[b1][y1];
    bucket[a1][x1]=t2;bucket[b1][y1]=t1;
    if(spread()<cur-0.0001){done=false}
    else{bucket[a1][x1]=t1;bucket[b1][y1]=t2}}
  if(done)break}

 bucket.forEach(function(b,k){b.forEach(function(mid){r.teams[mid]=TEAM_KEYS[k]})});
 return r.teams}
function teamResult(r,g){
 var basis=g.basis||"net";
 if(!GAMES[basis]||basis==="team")basis="net";
 var asc=g.rev?!GAMES[basis].asc:GAMES[basis].asc;
 function val(mid){return basisVal(r,mid,basis)}
 var grp=teamsOf(r);
 var sides=TEAM_KEYS.filter(function(k){return grp[k]&&grp[k].length}).map(function(k){
  return{key:k,rows:grp[k].map(function(mid){
   return{mid:mid,name:mname(mid),hcp:curHcp(mid),rh:roundHcp(r,mid),
    gross:grossOf(r,mid),v:val(mid)}})
   .filter(function(x){return x.v!=null})}})
  .filter(function(s){return s.rows.length});
 if(sides.length<2)return null;
 var mx=0;sides.forEach(function(s){if(s.rows.length>mx)mx=s.rows.length});
 sides.forEach(function(s){
  s.rows.forEach(function(x){x.mult=1});
  var d=mx-s.rows.length;if(d<=0)return;
  var byH=s.rows.slice().sort(function(x,y){return x.hcp-y.hcp});
  var m0=Math.floor((byH.length-1)/2);
  for(var k=0;k<d;k++){
   var idx=m0+(k%2===0?Math.ceil(k/2):-Math.ceil(k/2));
   if(idx<0)idx=0;if(idx>=byH.length)idx=byH.length-1;
   byH[idx].mult=(byH[idx].mult||1)+1}});
 sides.forEach(function(s){var t=0;
  s.rows.forEach(function(x){t+=x.v*(x.mult||1)});
  s.total=Math.round(t*10)/10});
 var rk={};
 rankBy(sides.map(function(s){return{key:s.key,v:s.total}}),asc).forEach(function(x){rk[x.key]=x});
 sides.forEach(function(s){s.rank=rk[s.key].rank;s.tie=rk[s.key].tie});
 sides.sort(function(a,b){return a.rank!==b.rank?a.rank-b.rank:(a.key<b.key?-1:1)});
 return{sides:sides,asc:asc,basis:basis}}

function roundSummary(r){

 if(uptoId){for(var i=0;i<rs.length;i++)if(rs[i].id===uptoId){cut=i+1;break}}

/* ===== 공급용 창구: 숨은 폼과 iframe을 통한 요청/응답 =====
 * Google Apps Script ContentService의 브라우저 CORS 제약을 피하기 위해
 * 인증정보를 GET/JSONP로 전달하지 않고 HTTPS POST 본문으로만 전달합니다.
 * 회신은 Google HtmlService의 postMessage를 nonce로 검증합니다.
 */
function cloudOn(){return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(L.cloudUrl||"")}
function cloudRpc(action, token, extra){
 return new Promise(function(resolve,reject){
  if(!cloudOn()){reject(new Error("설정에서 공급용 서버 주소를 먼저 등록하십시오."));return}
  var frame=document.createElement("iframe");
  var nonce="wgk"+Array.from(crypto.getRandomValues(new Uint8Array(16)),function(n){return n.toString(16).padStart(2,"0")}).join("");
  frame.name=nonce; frame.style.display="none";frame.setAttribute("aria-hidden","true");
  var form=document.createElement("form");form.method="POST";form.action=L.cloudUrl;
  form.target=nonce;form.style.display="none";form.acceptCharset="UTF-8";
  var request=Object.assign({action:action,clubId:SUPPLY_CLUB_ID,token:token||""},extra||{});
  function add(name,value){var x=document.createElement("input");x.type="hidden";x.name=name;x.value=value;form.appendChild(x)}
  add("payload",JSON.stringify(request));add("rid",nonce);
  add("origin",location.origin);
  var done=false;
  var timer=setTimeout(function(){finish(new Error("서버 응답이 없습니다. 배포 권한과 인터넷 연결을 확인하십시오."))},35000);
  function onMsg(ev){
   var d=ev.data;
   if(!d||d.__wgkSupplyRpc!==true||d.rid!==nonce)return;
   // 비밀키로 인증하므로 회신도 반드시 Google Apps Script 호스트에서만 수락합니다.
   if(!/^https:\/\/([a-z0-9-]+\.)?(googleusercontent\.com|google\.com)$/.test(ev.origin))return;
   finish(null,d.response);
  }
  function finish(err,result){
   if(done)return;done=true;clearTimeout(timer);window.removeEventListener("message",onMsg);
   form.remove();frame.remove();if(err)reject(err);else resolve(result);
  }
  window.addEventListener("message",onMsg);
  document.body.appendChild(frame);document.body.appendChild(form);
  try{form.submit()}catch(e){finish(e)}
 })
}

/* 화면과 서버의 앞 두 자리가 다르면 짝이 어긋난 것으로 봅니다.
   끝자리는 고치기만 한 판이라 섞여 있어도 보통 문제가 없습니다. */
function verMismatch(){

 cloudRpc("status",L.cloudReadKey).then(function(res){
  if(!res||!res.ok||!res.version)return;
  if(res.serverVer)L.serverVer=res.serverVer;
  var isNew=(L.lastName!==res.version);

 },function(){});
}
function pullCloud(silent){
 if(!cloudOn()){if(!silent)toast("설정에 서버 주소를 넣어 주십시오.");return}
 var key=L.cloudReadKey;
 if(!key){if(!silent){toast("설정에서 회원용 접근 키를 입력해 주세요.");go("data")}return}
 if(busy)return;busy=true;if(!silent)toast("최신 기록을 확인하고 있습니다…");
 cloudRpc("latest",key).then(function(res){busy=false;
  if(!res||!res.ok){if(!silent)toast("받기 실패: "+(res&&res.error||"인증 오류"));return}
  if(!res.version)return;
  if(res.serverVer)L.serverVer=res.serverVer;
  if(L.lastName===res.version&&S.room&&S.room.id!=="pending"){L.cloudNew=false;save(false);if(!silent)toast("이미 최신 기록입니다.");render();return}
  var inc;try{inc=JSON.parse(res.data)}catch(e){toast("기록 파일을 읽지 못했습니다.");return}
  if(!validClubData(inc)){toast("다른 모임의 기록은 받아올 수 없습니다.");return}
  function apply(){S=inc;SUPPLY_CLUB_NAME=inc.room.name;try{setDocTitle(inc.room.name)}catch(e){}L.lastName=res.version;L.lastSync=new Date().toISOString();L.dirty=false;L.cloudNew=false;if(res.serverVer)L.serverVer=res.serverVer;save(false);go("home");if(!silent)toast("최신 기록을 받았습니다.")}
  if(S.room.id==="pending"&&!L.dirty){apply();return}
  if(L.dirty){ask("이 기기에 아직 서버에 올리지 않은 수정사항이 있습니다. 최신 서버 기록을 받으면 그 수정사항이 사라집니다. 계속할까요?",apply,"받기");return}
  if(silent){apply();return}
  ask("서버의 최신 기록을 받으면 이 기기에 저장된 기록이 바뀝니다. 계속할까요?",apply,"받기");
 },function(e){busy=false;if(!silent)toast("연결 오류: "+e.message)})
}

function saveRoundEdit(rid){
 var r=round(rid);if(!r)return;
 var tee=document.getElementById("et").value;
 if(!teeTimeValid(tee)){toast("티오프 시간을 확인하십시오.");return}
 var pk=readPlayers(),games=readGames();
 if(!pk.players.length){toast("참가자를 한 분 이상 선택해 주세요.");return}
 if(!games.length){toast("경기 종목을 하나 이상 선택해 주세요.");return}
 var ng=games.filter(function(g){return g.type==="team"})[0];
 if(ng&&(ng.teamCount<2||ng.teamCount>4)){toast("팀 수는 2~4개로 정해 주세요.");return}
 if(games.some(function(g){return g.prize<0})){toast("상금은 0원 이상으로 입력해 주세요.");return}
 var pars=[],patches=[],gross={};
 var valid=true;
 [].slice.call(document.querySelectorAll(".epar")).forEach(function(x){
  var v=x.value.trim(),n=Number(v);
  if(v&&(!Number.isInteger(n)||n<3||n>6))valid=false;
  pars[Number(x.getAttribute("data-hole"))-1]=v?n:0;
 });
 if(!valid){toast("홀별 파는 3~6 사이 정수로 입력해 주세요.");return}
 [].slice.call(document.querySelectorAll(".escore")).forEach(function(x){
  var mid=x.getAttribute("data-mid");if(pk.players.indexOf(mid)<0)return;
  var v=x.value.trim(),n=Number(v);
  if(v&&(!Number.isInteger(n)||n<=0))valid=false;
  patches.push({mid:mid,h:Number(x.getAttribute("data-hole")),score:v?n:null});
 });
 if(!valid){toast("홀별 타수는 양의 정수로 입력해 주세요.");return}
 [].slice.call(document.querySelectorAll(".eg")).forEach(function(x){
  var mid=x.getAttribute("data-mid");if(pk.players.indexOf(mid)<0)return;
  var v=x.value.trim(),n=Number(v);
  if(v&&(!Number.isInteger(n)||n<=0))valid=false;
  gross[mid]=v?n:null;
 });
 if(!valid){toast("최종 타수는 양의 정수로 입력해 주세요.");return}
 var draft=JSON.parse(JSON.stringify(r));
 draft.date=document.getElementById("ed").value||r.date;
 draft.teeTime=tee;
 draft.place=document.getElementById("ep").value.trim();
 draft.venue=document.getElementById("ev").value;
 draft.course=document.getElementById("ec").value.trim();
 /* 회원목록에서 이미 삭제한 사람의 옛 라운드 기록은 보존합니다. */
 var removedMembers=r.players.filter(function(mid){return !member(mid)});
 var oldTeamAssignments={};
 removedMembers.forEach(function(mid){if(r.teams&&r.teams[mid])oldTeamAssignments[mid]=r.teams[mid]});
 draft.games=games;draft.players=pk.players.concat(removedMembers);
 draft.teams=Object.assign(oldTeamAssignments,pk.teams);draft.pars=pars;
 pk.players.forEach(function(mid){if(!draft.groupOf[mid])draft.groupOf[mid]=1});
 patches.forEach(function(x){
  var old=cell(draft,x.mid,x.h);
  if(old&&old.s===x.score)return;
  setCell(draft,x.mid,x.h,x.score==null?null:{s:x.score,st:"ok"});
 });
 Object.keys(gross).forEach(function(mid){
  if(gross[mid]==null)delete draft.grossOnly[mid];else draft.grossOnly[mid]=gross[mid]});
 if(ng){
  var assigned=Object.keys(teamsOf(draft));
  /* 직접 지정한 C·D팀을 임의로 다시 배정하지 않고 팀 수를 맞춥니다. */
  if(assigned.length){
   var highest=Math.max.apply(null,assigned.map(function(k){return TEAM_KEYS.indexOf(k)+1}));
   ng.teamCount=Math.max(ng.teamCount,highest);
  }else autoTeams(draft,ng.teamCount,ng.basis);
 }
 var ep=document.getElementById("eperio");
 if(ep&&ep.value){draft.perio=ep.value.split(",").map(Number).filter(function(n){return n>=1&&n<=draft.holeCount})}
 if(needPerio(games)&&(!draft.perio||!draft.perio.length))drawPerio(draft);
 var pos=S.rounds.indexOf(r);if(pos<0)return;
 S.rounds[pos]=draft;
 save();go("result",{rid:rid});toast("라운딩 수정을 저장했습니다.");
}

  var ind=rankBy(tr.sides.reduce(function(acc,sd){
   return acc.concat(sd.rows.map(function(x){
    return{mid:x.mid,name:x.name,v:x.v,team:sd.key,gross:x.gross,rh:x.rh}}))},[]),tr.asc);
  var irk={};ind.forEach(function(x){irk[x.mid]=x});
  var body="";

   body+='<tr'+(sd.rank===1?' class="gold"':'')+'>'+

   sd.rows.slice().sort(function(x,y){return irk[x.mid].rank-irk[y.mid].rank}).forEach(function(x){

     '<td>'+(x.mult>1?"\u00d7"+x.mult:"")+'</td></tr>'})});
  var w=tr.sides.filter(function(sd){return sd.rank===1}),cnt=0;
  w.forEach(function(sd){cnt+=sd.rows.length});
  var prize=g.prize?('<p class="note">상금 '+won(g.prize)+' \u00b7 '+
   w.map(function(sd){return sd.key+"팀"}).join(", ")+' \u00b7 1인당 '+
   won(Math.floor(g.prize/Math.max(1,cnt)))+'</p>'):"";
  return '<div class="card"><h2>팀전 <span class="mt">'+basisName(tr.basis)+(g.rev?' <span class="reverse-label">거꾸로</span>':'')+'</span></h2>'+

   '<p class="note">'+basisName(tr.basis)+' 점수를 더해 '+(tr.asc?"적은":"많은")+' 팀이 이깁니다. '+
   GAMES[tr.basis].desc+'. 인원이 맞지 않는 팀은 핸디가 중간인 분의 점수를 두 배로 칩니다.</p>'+prize+'</div>'}

   지시문을 엄격한 형식으로 바꾸고, 라운드까지 통째로 만들 수 있게 했습니다.

var CARD_HEAD="#WGK1";

function copyText(t){
 function fallback(){
  try{
   var ta=document.createElement("textarea");
   ta.value=t;ta.setAttribute("readonly","");
   ta.style.position="fixed";ta.style.top="-1000px";ta.style.opacity="0";
   document.body.appendChild(ta);ta.select();
   try{ta.setSelectionRange(0,t.length)}catch(e){}
   var ok=document.execCommand("copy");ta.remove();
   toast(ok?"복사했습니다.":"복사하지 못했습니다. 글을 길게 눌러 직접 복사해 주십시오.")
  }catch(e){toast("복사하지 못했습니다. 글을 길게 눌러 직접 복사해 주십시오.")}}
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(function(){toast("복사했습니다.")},fallback)}
 else fallback()}
function cardPrompt(holeCount,forNew){

 return "첨부한 골프 스코어카드 사진을 읽어 아래 형식 그대로만 출력하십시오.\n"+
 "설명, 인사말, 제목, 표, 굵은 글씨, 코드블록을 절대 붙이지 마십시오.\n\n"+

 "[이름 규칙]\n"+
 "아래 명단에 있는 이름이나 괄호 안 닉네임과 같으면 그 글자를 그대로 적습니다.\n"+
 "명단에 없는 사람도 카드에 있으면 카드에 적힌 그대로 적습니다. 빼지 마십시오.\n"+
 "명단: "+(who||"(등록된 회원 없음)")+"\n\n"+
 "[출력 예시]\n"+
 CARD_HEAD+"\n"+
 "DATE: 2026-10-12\nTIME: 07:30\nTYPE: 필드\nPLACE: 남서울CC\nCOURSE: 동코스\nHOLES: "+(hc<10?"0"+hc:hc)+"\n"+
 "PAR: "+pars.join(" ")+"\n"+
 "P: "+(S.members[0]?S.members[0].name:"홍길동")+" | "+line.join(" ")+" | 0"+
 (line.reduce(function(x,y){return x+parseInt(y,10)},0))+"\n"+
 "#END";

function normName(s){return String(s==null?"":s).replace(/[\s()·.·]/g,"").toLowerCase()}
/* 이름과 닉네임을 모두 견주어 회원을 찾습니다. pool 은 회원 id 배열입니다. */
function matchMember(raw,pool){
 var n=normName(raw);if(!n)return null;
 function keys(mid){var m=member(mid);if(!m)return [];
  return [normName(m.name)].concat(m.nick?[normName(m.nick)]:[])}
 var i,j,k,ks;
 for(i=0;i<pool.length;i++){ks=keys(pool[i]);for(j=0;j<ks.length;j++)if(ks[j]===n)return pool[i]}
 for(i=0;i<pool.length;i++){ks=keys(pool[i]);
  for(j=0;j<ks.length;j++){var x=ks[j];if(x&&(x.indexOf(n)===0||n.indexOf(x)===0))return pool[i]}}
 for(i=0;i<pool.length;i++){ks=keys(pool[i]);
  for(j=0;j<ks.length;j++){var y=ks[j];
   if(y.length&&n.length&&y[0]===n[0]&&Math.abs(y.length-n.length)<=1)return pool[i]}}
 return null}

/* 카드 글을 읽어 구조로 바꿉니다. 실패하면 why 에 이유를 담습니다. */
function parseCard(txt){
 var out={ok:false,why:"",meta:{},pars:null,rows:[],holeCount:0,warn:[]};
 if(!txt||!txt.trim()){out.why="붙여 넣은 글이 없습니다.";return out}
 /* v1.3.1 붙여넣기에서 줄바꿈이 사라지는 경우가 있어, 항목 이름 앞에
    줄바꿈을 다시 넣어 한 줄짜리 글도 읽어냅니다. */
 var norm=txt.replace(/\r/g,"\n")
  .replace(/(#WGK1|#END)/g,"\n$1\n")
  .replace(/(^|[\s|])(DATE|TIME|TYPE|PLACE|COURSE|HOLES|PAR|P)\s*:\s*/g,"\n$2: ");
 var lines=norm.split("\n").map(function(x){return x.trim()}).filter(function(x){return x});
 var hi=-1;for(var i=0;i<lines.length;i++)if(lines[i].indexOf(CARD_HEAD)===0){hi=i;break}
 if(hi<0){out.why="첫 줄의 "+CARD_HEAD+" 표시를 찾지 못했습니다. 지시문을 그대로 넣으셨는지 확인해 주십시오.";return out}
 lines=lines.slice(hi+1);
 var end=lines.indexOf("#END");if(end>=0)lines=lines.slice(0,end);
 function nums(part,want){
  var t=(part||"").match(/(\d{1,2}|\?\?|\?)/g)||[];
  var v=t.map(function(x){if(x.indexOf("?")>=0)return null;var q=parseInt(x,10);return isNaN(q)?null:q});
  if(want){while(v.length<want)v.push(null);v=v.slice(0,want)}
  return v}
 var hc=0;
 lines.forEach(function(ln){
  var m=ln.match(/^HOLES\s*:\s*(\d{1,2})/i);if(m)hc=parseInt(m[1],10)});
 lines.forEach(function(ln){
  var m=ln.match(/^PAR\s*:\s*(.+)$/i);
  if(m&&!hc){var t=nums(m[1]);hc=t.length>=9?(t.length>=18?18:9):0}});
 if(!hc)hc=18;
 out.holeCount=hc;
 lines.forEach(function(ln){
  var m;
  if((m=ln.match(/^DATE\s*:\s*(\d{4})[-./](\d{1,2})[-./](\d{1,2})/i)))
   out.meta.date=m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
  else if((m=ln.match(/^TIME\s*:\s*(\d{1,2})\s*[:시]\s*(\d{1,2})/i)))
   out.meta.teeTime=("0"+m[1]).slice(-2)+":"+("0"+m[2]).slice(-2);
  else if((m=ln.match(/^TYPE\s*:\s*(.+)$/i)))
   out.meta.venue=/스크린|screen/i.test(m[1])?"screen":(/필드|field/i.test(m[1])?"field":"");
  else if((m=ln.match(/^PLACE\s*:\s*(.+)$/i))) out.meta.place=m[1].trim().slice(0,60);
  else if((m=ln.match(/^COURSE\s*:\s*(.+)$/i))) out.meta.course=m[1].trim().slice(0,60);
  else if((m=ln.match(/^PAR\s*:\s*(.+)$/i))) out.pars=nums(m[1],hc);
  else if((m=ln.match(/^P\s*:\s*(.+)$/i))){
   var body=m[1],parts=body.split("|").map(function(x){return x.trim()});
   var who,vals,total=null;
   if(parts.length>=2){
    who=parts[0];vals=nums(parts[1],hc);
    if(parts.length>=3){var t=nums(parts[2]);total=t.length?t[t.length-1]:null;
     if(parts[2].replace(/\D/g,"").length>=3)total=parseInt(parts[2].replace(/\D/g,""),10)}
   }else{
    var head=body.split(/\s+/)[0];who=head;vals=nums(body.slice(head.length),hc)}
   if(!who)return;
   out.rows.push({raw:who,mid:null,vals:vals,total:total,newName:""})}
 });
 if(!out.rows.length){out.why="P: 로 시작하는 사람 줄을 찾지 못했습니다.";return out}
 var pool=S.members.map(function(x){return x.id});
 out.rows.forEach(function(row){
  var mid=matchMember(row.raw,pool);
  if(mid){row.mid=mid;pool=pool.filter(function(x){return x!==mid})}});
 out.ok=true;return out}

/* 합계 검산: 읽은 홀별 합과 카드 합계가 다르면 알려 줍니다. */
function rowSum(vals){var t=0,n=0;vals.forEach(function(v){if(typeof v==="number"){t+=v;n++}});
 return{sum:t,filled:n}}

function scanConfirm(r){

 var hc=scan.holeCount;
 var head='<tr><th>이름</th>';
 for(var i=0;i<hc;i++){var pv=scan.pars&&typeof scan.pars[i]==="number"?scan.pars[i]:null;
  head+='<th>'+(i+1)+'<br><span class="mt">'+(pv?pv:"·")+'</span></th>'}
 head+='<th>합</th><th>카드</th></tr>';
 var body=scan.rows.map(function(row,ri){
  var opts='<option value="">(넣지 않음)</option>'+
   S.members.map(function(m){return '<option value="'+m.id+'"'+(row.mid===m.id?" selected":"")+'>'+
    esc(m.nick?(m.name+" ("+m.nick+")"):m.name)+'</option>'}).join("");
  var sel='<select onchange="scanSetMember('+ri+',this.value)">'+opts+'</select>';
  var add=row.mid?'':'<div style="height:5px"></div><button class="chip" onclick="scanAddMember('+ri+')">이 이름으로 회원 등록</button>';
  var cells="";
  for(var h=0;h<hc;h++){var v=row.vals[h];
   cells+='<td><input type="number" min="1" inputmode="numeric" value="'+(v==null?"":v)+
    '" onchange="scanSetVal('+ri+','+h+',this.value)"></td>'}
  var rs=rowSum(row.vals);
  var okTotal=(row.total==null)||(rs.filled===hc&&rs.sum===row.total);
  cells+='<td><b>'+(rs.filled?rs.sum:"-")+'</b></td>'+
   '<td'+(okTotal?'':' class="u"')+'>'+(row.total==null?"-":row.total)+(okTotal?"":" ✕")+'</td>';
  return '<tr><td style="min-width:150px">'+sel+

function applyScan(){
 var r=round(scan.rid);if(!r){scan=null;render();return}
 var cb=document.getElementById("usepar");
 if(cb&&cb.checked&&scan.pars)for(var i=0;i<r.holeCount;i++)
  if(typeof scan.pars[i]==="number")r.pars[i]=scan.pars[i];
 var n=0;
 scan.rows.forEach(function(row){if(!row.mid)return;
  if(r.players.indexOf(row.mid)<0)r.players.push(row.mid);
  row.vals.forEach(function(v,i){if(typeof v!=="number")return;
   setCell(r,row.mid,i+1,{s:v,st:"ok"});n++});
  if(hasHoles(r,row.mid))delete r.grossOnly[row.mid]});
 r.confirmed=true;save();var rid=r.id;scan=null;go("result",{rid:rid});
 toast(n+"개 칸을 저장했습니다.")}

function scrYear(){
 var years={};S.rounds.forEach(function(r){var y=(r.date||"").slice(0,4);if(y)years[y]=true});
 var ys=Object.keys(years).sort().reverse();
 var y=view.year||ys[0]||String(new Date().getFullYear());
 var rs=S.rounds.filter(function(r){return (r.date||"").indexOf(y)===0});
 var acc={};
 function A(mid){if(!acc[mid])acc[mid]={mid:mid,name:mname(mid),prize:0,last:0,wins:0,
  dapa:0,birdie:0,onion:0,improve:0,rounds:0};return acc[mid]}
 rs.forEach(function(r){
  r.players.forEach(function(mid){A(mid).rounds++});
  ["dapa","birdie","onion"].forEach(function(t){
   r.players.forEach(function(mid){if(hasHoles(r,mid))A(mid)[t]+=countType(r,mid,t)})});
  r.players.forEach(function(mid){var im=improveOf(r,mid);if(im!=null&&im>0)A(mid).improve+=im});
  roundGames(r).forEach(function(g){
   if(g.type==="team"){
    var tr=teamResult(r,g);if(!tr)return;
    var w=tr.sides.filter(function(s){return s.rank===1}),cnt=0;
    w.forEach(function(s){cnt+=s.rows.length});
    if(!cnt)return;
    w.forEach(function(s){s.rows.forEach(function(x){
     A(x.mid).wins++;if(g.prize)A(x.mid).prize+=Math.floor(g.prize/cnt)})});
    return}
   var rows=gameRows(r,g.type,g.rev);if(!rows.length)return;
   var w=rows.filter(function(x){return x.rank===1});
   w.forEach(function(x){A(x.mid).wins++;if(g.prize)A(x.mid).prize+=Math.floor(g.prize/w.length)})});
  var nr=gameRows(r,"net");
  if(nr.length){var mx=nr[nr.length-1].rank;
   nr.filter(function(x){return x.rank===mx}).forEach(function(x){A(x.mid).last++})}});
 var arr=Object.keys(acc).map(function(k){return acc[k]});
 function tbl(title,key,unit,desc){

  return '<div class="card"><h2>'+title+'</h2><table><tbody>'+
   a.map(function(x,i){return '<tr><td>'+(i+1)+'. '+esc(x.name)+'</td><td class="'+(i===0?"win":"")+'">'+
    (unit==="원"?won(x[key]):x[key]+unit)+'</td></tr>'}).join("")+'</tbody></table>'+
   (desc?'<p class="note">'+desc+'</p>':'')+'</div>'}
 var hc=S.members.map(function(m){
  var inY=sortedRounds().filter(function(r){return (r.date||"").indexOf(y)===0&&r.players.indexOf(m.id)>=0});
  var mine=sortedRounds().filter(function(r){return r.players.indexOf(m.id)>=0});
  if(!inY.length||!mine.length)return{name:m.name,year:0,all:0};
  var startH=hcpAt(m.id,inY[0].date,inY[0].id);

  return{name:m.name,year:startH-curHcp(m.id),all:firstH-curHcp(m.id)}});
 function hcTbl(title,key,desc){
  var a=hc.filter(function(x){return x[key]>0}).sort(function(p,q){return q[key]-p[key]});
  if(!a.length)return '<div class="card"><h2>'+title+'</h2><div class="empty">줄어든 분이 없습니다.</div>'+
   '<p class="note">'+desc+'</p></div>';
  return '<div class="card"><h2>'+title+'</h2><table><tbody>'+
   a.map(function(x,i){return '<tr><td>'+(i+1)+'. '+esc(x.name)+'</td><td class="'+(i===0?"win":"")+'">'+x[key]+'만큼</td></tr>'}).join("")+
   '</tbody></table><p class="note">'+desc+'</p></div>'}
 var sel=ys.map(function(v){return '<button class="chip'+(v===y?" on":"")+'" onclick="go(\'year\',{year:\''+v+'\'})">'+v+'</button>'}).join(" ");
 return '<div class="screen"><div class="bar"><button class="chip" onclick="go(\'home\')">뒤로</button><h1>'+y+'년 집계</h1></div>'+
 '<div class="body">'+(ys.length>1?'<div class="card">'+sel+'</div>':'')+

 tbl("우승 횟수","wins","회","종목별 1등을 합친 횟수입니다. 팀전은 이긴 팀 모두에게 셉니다.")+

 tbl("꼴찌왕","last","회","핸디 적용 순위에서 꼴찌를 한 횟수입니다.")+

 (host?'<div class="card"><h2>경기위원장 암호 변경</h2><p class="note">현재 암호를 입력하고 새 암호를 설정합니다. 변경 시 다른 기기의 기존 경기위원장 인증은 해제됩니다.</p>'+ 
 '<label for="hostOldPw">현재 암호</label><input type="password" id="hostOldPw" autocomplete="current-password" placeholder="현재 경기위원장 암호">'+
 '<label for="hostNewPw">새 암호 (10~72글자)</label><input type="password" id="hostNewPw" autocomplete="new-password" placeholder="새 경기위원장 암호">'+
 '<label for="hostNewPw2">새 암호 확인</label><input type="password" id="hostNewPw2" autocomplete="new-password" placeholder="새 암호를 다시 입력">'+
 '<div style="height:10px"></div><button class="btn sm quiet" onclick="changeHostPassword()">암호 변경</button></div>':'')+
 '<div class="card"><h2>프로그램 판본</h2>'+
 '<p class="note">화면 <b>H'+APP_VER+'</b> · 서버 <b>'+(L.serverVer?("S"+L.serverVer):"확인 전")+'</b></p>'+
 '<p class="note">H는 깃허브에 올리는 화면 파일이고 S는 앱스 스크립트 서버입니다. 둘은 짝이므로 함께 올리셔야 합니다.</p>'+
 (verMismatch()?'<p class="note" style="color:var(--clay)"><b>짝이 맞지 않습니다.</b> 화면과 서버 중 한쪽이 아직 옛 판입니다. 둘 다 같은 판으로 올려 주십시오.</p>':'')+
 '<div style="height:10px"></div><button class="btn sm quiet" onclick="peekCloud();toast(\'서버 판본을 확인했습니다.\')">서버 판본 확인</button></div>'+
 '<div class="card"><h2>이 기기의 자료</h2><p class="note">서버의 기록을 삭제하지 않고 이 기기에 저장된 자료만 초기화합니다.</p><div style="height:10px"></div><button class="btn sm line" onclick="wipe()">이 기기의 기록 지우기</button></div>'+

function saveCloud(){
 var u=document.getElementById("cu").value.trim();
 if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(u)){toast("구글 앱스 스크립트 웹앱의 /exec 주소만 사용할 수 있습니다.");return}
 L.cloudUrl=u;
 var r=document.getElementById("crk").value.trim();if(r)L.cloudReadKey=r;
 save(false);render();toast("연결 설정을 저장했습니다.")
}
function changeClubName(){
 if(!hostSessionActive()){toast('경기위원장 인증이 필요합니다.');return}
 if(!cloudOn()||!L.cloudReadKey||!L.lastName||S.room.id==='pending'){
  toast('서버에서 최신 기록을 먼저 받으십시오.');return;
 }
 if(L.dirty){toast('아직 서버에 올리지 않은 수정사항이 있습니다. 먼저 저장하거나 별도로 백업하십시오.');return}
 var input=document.getElementById('newClubName');if(!input)return;
 var newName=input.value;
 if(newName.length<2||newName.length>60||newName.trim()!==newName||/[\x00-\x1f\x7f<>]/.test(newName)){
  toast('모임 이름은 앞뒤 공백 없는 2~60글자로 입력하십시오.');return;
 }
 if(newName===S.room.name){toast('현재 모임 이름과 같습니다.');return}
 if(!confirm('모임 이름을 ‘'+newName+'’(으)로 바꾸시겠습니까?\n기존 회원과 라운딩 기록, 초대주소는 유지됩니다.'))return;
 if(busy)return;busy=true;
 cloudRpc('renameClub',L.cloudReadKey,{hostSession:hostSession,baseVersion:L.lastName,newName:newName}).then(function(res){busy=false;
  if(res&&res.ok&&res.version){
   S.room.name=res.clubName;SUPPLY_CLUB_NAME=res.clubName;
   L.lastName=res.version;L.lastSync=new Date().toISOString();L.dirty=false;save(false);render();
   toast('모임 이름을 변경했습니다. 회원은 최신 기록을 받으면 새 이름이 표시됩니다.');
  }else if(res&&res.conflict)toast('서버 기록이 변경되었습니다. 먼저 최신 기록을 받은 후 다시 진행하십시오.');
  else if(isHostExpiredResult(res))rejectHostSession(res.error);
  else toast('모임 이름 변경 실패: '+(res&&res.error||'서버에서 확인이 필요합니다.'));
 },function(e){busy=false;toast('모임 이름 변경 통신 오류: '+e.message)});
}
function setRole(m){
 if(m!=="host"){
  forgetHostSession();L.mode="member";save(false);render();toast("회원 모드로 전환했습니다.");return;
 }
 if(hostSessionActive())return;
 askPw();
}
function askPw(){
 if(!L.cloudReadKey||!cloudOn()){toast("회원용 서버 연결을 먼저 설정하십시오.");return}
 sheet='<div class="sheet"><div class="inner"><h2 style="margin:0 0 6px;font-size:16px">경기위원장 암호 인증</h2>'+ 
 '<p class="note">경기위원장 암호만 입력하십시오. 기존 쓰기 키는 사용하지 않습니다.</p>'+ 
 '<input type="password" id="hpw" autocomplete="current-password" placeholder="경기위원장 암호">'+
 '<div style="height:12px"></div><button class="btn sm" onclick="tryHost()">인증</button>'+ 
 '<div style="height:8px"></div><button class="btn sm quiet" onclick="askNo()">취소</button></div></div>';render();
}
function tryHost(){
 var x=document.getElementById("hpw"),password=x&&x.value;
 if(!password||!cloudOn()||!L.cloudReadKey){toast("경기위원장 암호와 회원용 서버 연결을 확인하십시오.");return}
 if(busy)return;busy=true;
 cloudRpc("hostAuth",L.cloudReadKey,{password:password}).then(function(res){busy=false;
  if(!res||!res.ok||!res.session){toast((res&&res.error)||"암호 인증에 실패했습니다.");return}
  rememberHostSession(res.session);L.mode="host";sheet=null;save(false);render();toast("경기위원장 인증 성공 (12시간 유효)");
  if(!L.lastName)pullCloud(true);
 },function(e){busy=false;toast("서버 인증 실패: "+e.message)});
}
function changeHostPassword(){
 if(!hostSessionActive()){toast("경기위원장 인증을 먼저 해주십시오.");return}
 var old=document.getElementById("hostOldPw"),next=document.getElementById("hostNewPw"),again=document.getElementById("hostNewPw2");
 if(!old||!next||!again)return;
 var current=old.value,future=next.value;
 if(future!==again.value){toast("새 암호 확인이 일치하지 않습니다.");return}
 if(future.length<10||future.length>72||future.trim()!==future){toast("새 암호는 공백 없는 10~72글자로 입력하십시오.");return}
 if(!current){toast("현재 암호를 입력하십시오.");return}
 if(!confirm("암호를 변경하면 다른 기기의 기존 경기위원장 인증이 해제됩니다. 계속할까요?"))return;
 if(busy)return;busy=true;
 cloudRpc("changeHostPassword",L.cloudReadKey,{hostSession:hostSession,currentPassword:current,newPassword:future}).then(function(res){busy=false;
  old.value="";next.value="";again.value="";
  if(res&&res.ok&&res.session){rememberHostSession(res.session);toast("경기위원장 암호를 변경했습니다. 다른 기기는 재인증이 필요합니다.")}
  else if(isHostExpiredResult(res))rejectHostSession(res.error);
  else toast("암호 변경 실패: "+(res&&res.error||"서버 응답을 확인하십시오."));
 },function(e){busy=false;toast("암호 변경 오류: "+e.message)});
}
function wipe(){
 if(!confirm("이 기기에 저장된 기록만 삭제합니다. 서버의 기록은 보존됩니다. 진행할까요?"))return;
 S=blankS();L.lastName="";L.lastSync=null;L.dirty=false;save(false);go("home");toast("이 기기 기록을 초기화했습니다. 서버에서 다시 받으십시오.")
}
/* ---- 보관본 ---- */
function backupText(){
 return "[우리끼리 골프챌린지 전체 데이터] "+(S.room?S.room.name:"")+" "+fmt(new Date().toISOString())+
  "\n회원 "+S.members.length+"명 · 라운드 "+S.rounds.length+"회"+
  "\n이 글 전체를 복사해 설정 화면의 모든 데이터 복원에 붙여 넣으시면 그대로 되살아납니다."+
  "\n\nWGK:"+JSON.stringify(S)}
function shareAll(){
 var t=backupText();
 if(navigator.share){
  navigator.share({text:t}).then(function(){},function(e){
   if(e&&e.name==="AbortError")return;
   copyAll(true)});
  return}
 copyAll(true)}
function copyAll(fallback){
 var t=backupText();
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(function(){
   toast(fallback?"이 화면에서는 공유창이 열리지 않아 복사했습니다. 단톡방에 붙여 넣으세요."
    :"모든 데이터를 복사했습니다.")},function(){showBackup()})}
 else showBackup()}
function showBackup(){
 var b=document.getElementById("bkbox");if(!b)return;
 b.innerHTML='<div style="height:10px"></div>'+
  '<p class="note">자동 복사가 되지 않았습니다. 아래 글을 길게 눌러 전체를 복사해 주십시오.</p>'+
  '<textarea readonly id="bk">'+esc(backupText())+'</textarea>'}
function restoreBackup(){
 var v=document.getElementById("rb").value,i=v.indexOf("WGK:");
 if(i<0){toast("우리끼리 골프챌린지 데이터를 찾지 못했습니다.");return}
 var rest=v.slice(i+4),a=rest.indexOf("{"),b=rest.lastIndexOf("}");
 if(a<0||b<a){toast("내용을 읽지 못했습니다.");return}
 var o;try{o=JSON.parse(rest.slice(a,b+1))}catch(e){toast("내용을 읽지 못했습니다.");return}
 if(!validClubData(o)||!S.room||o.room.id!==S.room.id){toast("이 모임의 현재 데이터와 일치하는 백업만 복원할 수 있습니다.");return}
 if(!confirm("지금 기록을 붙여 넣으신 데이터로 모두 바꿉니다.\n회원 "+(o.members||[]).length+"명, 라운드 "+(o.rounds||[]).length+"회입니다.\n계속할까요?"))return;
 S=o;if(!S.members)S.members=[];if(!S.rounds)S.rounds=[];if(!S.hcpWindow)S.hcpWindow=5;
 save(false);go("home");toast("모든 데이터를 복원했습니다.")}

/* ---- 공급본 시작: 초기 화면은 서버에 등록된 빈 모임 기준 ---- */
load();
/* v1.3.1 홈 화면에 추가할 때 쓰이는 이름을 모임 이름으로 맞춥니다. */
try{if(S&&S.room&&S.room.name)setDocTitle(S.room.name)}catch(e){}
render();
if(!SUPPLY_CLUB_PICK&&cloudOn()&&L.cloudReadKey)setTimeout(function(){
 if(L.dirty)peekCloud(); else pullCloud(true);
},600);
window.addEventListener("pagehide",function(){if(view.name==="play")recordTime()});
document.addEventListener("visibilitychange",function(){
 if(document.visibilityState==="hidden"&&view.name==="play")recordTime();
 if(document.visibilityState==="visible"&&view.name==="play")markEnter()});
</script>
